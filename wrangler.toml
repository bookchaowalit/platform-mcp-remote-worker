name = "solo-empire-mcp-remote"
main = "src/worker.ts"
compatibility_date = "2026-10-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# PUBLIC_ORIGIN must match the deployed HTTPS origin before MCP is enabled.
# Configure MCP_TOKEN_SHA256 and upstream read tokens with Wrangler secrets.
[vars]
AI_API_ORIGIN = "https://api.bookchaowalit.com"
AGENCY_CRM_ORIGIN = "https://crm-api-production-a7e0.up.railway.app"
INCOME_CRM_ORIGIN = "https://crm-api-production-19fd.up.railway.app"
ALLOWED_ORIGINS = ""
# Tool hub: every own Solo Empire cell (tasks = platform-empire tasks-api, gateway route
# empire-platform). Since 2026-11-03 every cell goes through the edge gateway
# (gateway.bookchaowalit.com/v1/<system>, platform-api-gateway SPEC-001). A value must be that
# exact form or a direct origin in CELL_HOSTS (src/worker.ts); others are rejected.
# Rollback: put a cell's direct origin back here and redeploy.
# Client systems are not listed. Set MCP_READONLY = "1" to allow GET only.
MCP_READONLY = ""
CELLS = '''{
  "accounts": "https://gateway.bookchaowalit.com/v1/accounts",
  "automation": "https://gateway.bookchaowalit.com/v1/automation",
  "budgets": "https://gateway.bookchaowalit.com/v1/budgets",
